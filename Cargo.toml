[package]
name = "parley_ratatui"
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Render Ratatui buffers through Parley and Vello into WGPU textures."
readme = "README.md"
documentation = "https://docs.rs/parley_ratatui"
keywords = ["ratatui", "parley", "vello", "terminal", "bevy"]
categories = ["command-line-interface", "gui", "rendering"]
exclude = [".DS_Store"]

[dependencies]
parley = "0.10.0"
ratatui = { version = "0.30.2", default-features = false }
swash = "0.2.8"
unicode-width = "0.2.2"
vello = "0.9.0"
# Vello uses naga; enabling its termcolor feature keeps naga compatible
# when Bevy's wgpu stack enables codespan-reporting's termcolor support.
naga = { version = "29.0.3", features = ["termcolor"] }

[dev-dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
    "keyboard",
] }
eframe = { version = "0.34.3", default-features = false, features = [
    "default_fonts",
    "glow",
] }
palette = "0.7.6"
pollster = "0.4.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "wayland",
    "x11",
] }
eframe = { version = "0.34.3", default-features = false, features = [
    "wayland",
    "x11",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "bevy_texture"
required-features = []

[[example]]
name = "bevy_zoom"
required-features = []

[[example]]
name = "bevy_colors_rgb"
required-features = []

[[example]]
name = "bevy_colors_rgb_large_font"
required-features = []

[[example]]
name = "egui_resizable"
required-features = []

[[example]]
name = "render_probe"
required-features = []
